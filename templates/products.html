<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop | SecureShop</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header class="topbar"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">S</span>SecureShop</a><nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('cart') }}">Cart ({{ cart_count }})</a><a href="{{ url_for('login') }}">Admin</a></nav></header><main class="container page"><p class="eyebrow">THE COLLECTION</p><h1>All products</h1><p class="muted">Small comforts, ready to ship.</p><div class="product-grid">{% for product in products %}<article class="product-card"><img src="{{ product.image }}" alt="{{ product.name }}"><div class="product-info"><h3>{{ product.name }}</h3><strong>${{ "%.2f"|format(product.price) }}</strong><form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}"><button class="primary" type="submit">Add to cart</button></form></div></article>{% endfor %}</div></main><footer>SecureShop · Your checkout details are encrypted before storage.</footer></body></html>
